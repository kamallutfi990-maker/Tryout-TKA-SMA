<svg viewBox="0 0 700 450" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="16" />
  <defs>
    <linearGradient id="gradBladder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#f59e0b" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#d97706" stopOpacity="0.7" />
    </linearGradient>
    <linearGradient id="gradTestis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.5" />
      <stop offset="100%" stopColor="#0284c7" stopOpacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="20" y="20" width="660" height="410" rx="12" fill="#020617" stroke="#334155" stroke-width="1.5" />
  <text x="40" y="52" fill="#38bdf8" font-size="16" font-weight="bold" font-family="system-ui, sans-serif">DIAGRAM SISTEM ORGAN REPRODUKSI PRIA</text>
  <text x="560" y="52" fill="#94a3b8" font-size="12" font-family="monospace">KODE: IMG_2361</text>
  <line x1="40" y1="65" x2="660" y2="65" stroke="#334155" stroke-width="1" />

  <!-- Background guide lines -->
  <path d="M 140,70 Q 120,200 150,300 Q 180,360 230,400" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
  <text x="80" y="210" fill="#475569" font-size="12" font-family="sans-serif">Tulang Panggul</text>

  <!-- Urinary Bladder -->
  <path d="M 310,130 C 250,130 230,190 250,230 C 270,260 340,265 370,230 C 400,195 370,130 310,130 Z" fill="url(#gradBladder)" stroke="#fbbf24" stroke-width="2.5" />
  <text x="270" y="185" fill="#fef3c7" font-size="13" font-weight="bold" font-family="sans-serif">Kandung Kemih</text>

  <!-- Seminal Vesicle -->
  <path d="M 380,210 C 400,200 420,215 415,235 C 410,250 390,245 380,230 Z" fill="#ec4899" stroke="#f472b6" stroke-width="2" />
  <line x1="415" y1="220" x2="490" y2="200" stroke="#f472b6" stroke-width="1.5" />
  <text x="500" y="205" fill="#f472b6" font-size="13" font-weight="bold" font-family="sans-serif">Vesikula Seminalis</text>

  <!-- Prostate Gland -->
  <path d="M 345,245 C 375,240 390,265 380,290 C 365,305 335,300 330,275 Z" fill="#8b5cf6" stroke="#a78bfa" stroke-width="2" />
  <line x1="385" y1="280" x2="490" y2="270" stroke="#a78bfa" stroke-width="1.5" />
  <text x="500" y="275" fill="#a78bfa" font-size="13" font-weight="bold" font-family="sans-serif">Kelenjar Prostat</text>

  <!-- Scrotum & Testis -->
  <path d="M 290,345 C 270,345 260,375 270,405 C 285,430 330,430 340,400 C 345,370 320,345 290,345 Z" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <ellipse cx="305" cy="385" rx="24" ry="20" fill="url(#gradTestis)" stroke="#38bdf8" stroke-width="2" />
  <text x="285" y="390" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif">Testis</text>

  <!-- Epididymis -->
  <path d="M 326,370 C 336,377 336,397 324,405 C 319,397 322,377 326,370 Z" fill="#f97316" stroke="#fb923c" stroke-width="2" />
  <line x1="334" y1="390" x2="490" y2="390" stroke="#fb923c" stroke-width="1.5" />
  <text x="500" y="395" fill="#fb923c" font-size="13" font-weight="bold" font-family="sans-serif">Epididimis</text>

  <!-- Vas Deferens -->
  <path d="M 326,370 Q 360,310 350,250 Q 340,180 290,170 Q 240,160 225,215 Q 215,280 285,285 Q 335,290 355,245" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round" />
  <path d="M 326,370 Q 360,310 350,250 Q 340,180 290,170 Q 240,160 225,215 Q 215,280 285,285 Q 335,290 355,245" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" />

  <!-- Urethra / Penis -->
  <path d="M 335,285 Q 325,310 305,320 Q 255,335 220,335" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />
  <text x="145" y="340" fill="#93c5fd" font-size="12" font-weight="bold" font-family="sans-serif">Uretra / Penis</text>

  <!-- PROMINENT TARGET LABEL X -->
  <g transform="translate(225, 190)" filter="url(#glow)">
    <circle cx="0" cy="0" r="26" fill="#ef4444" stroke="#ffffff" stroke-width="4" />
    <text x="0" y="10" fill="#ffffff" font-size="28" font-weight="900" text-anchor="middle" font-family="sans-serif">X</text>
  </g>

  <!-- Callout label -->
  <rect x="40" y="90" width="180" height="50" rx="8" fill="#1e1b4b" stroke="#ef4444" stroke-width="2" />
  <text x="50" y="112" fill="#fca5a5" font-size="12" font-weight="bold" font-family="sans-serif">SALURAN X</text>
  <text x="50" y="128" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif">= Vas Deferens</text>
</svg>
