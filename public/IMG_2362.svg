<svg viewBox="0 0 700 450" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="16" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-danger" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <rect x="20" y="20" width="660" height="410" rx="12" fill="#020617" stroke="#334155" stroke-width="1.5" />
  <text x="40" y="52" fill="#38bdf8" font-size="16" font-weight="bold" font-family="system-ui, sans-serif">JARING-JARING MAKANAN EKOSISTEM LAUT KUTUB</text>
  <text x="560" y="52" fill="#94a3b8" font-size="12" font-family="monospace">KODE: IMG_2362</text>
  <line x1="40" y1="65" x2="660" y2="65" stroke="#334155" stroke-width="1" />

  <!-- Produsen (Fitoplankton) -->
  <g transform="translate(45, 190)">
    <rect x="0" y="0" width="140" height="75" rx="12" fill="#065f46" stroke="#34d399" stroke-width="2" />
    <text x="70" y="28" fill="#a7f3d0" font-size="10" font-weight="bold" text-anchor="middle">PRODUSEN PRIMER</text>
    <text x="70" y="50" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Fitoplankton</text>
    <text x="70" y="65" fill="#6ee7b7" font-size="9.5" text-anchor="middle">(Alga Mikroskopis)</text>
  </g>

  <!-- Zooplankton -->
  <g transform="translate(245, 90)">
    <rect x="0" y="0" width="150" height="65" rx="12" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2" />
    <text x="75" y="25" fill="#93c5fd" font-size="10" font-weight="bold" text-anchor="middle">KONSUMEN I</text>
    <text x="75" y="47" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Krill & Zooplankton</text>
  </g>

  <!-- TARGET SOAL: Ikan Kecil -->
  <g transform="translate(245, 275)">
    <rect x="0" y="0" width="160" height="80" rx="12" fill="#7f1d1d" stroke="#f87171" stroke-width="3" />
    <rect x="6" y="6" width="148" height="20" rx="6" fill="#ef4444" />
    <text x="80" y="20" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">POPULASI ANJLOK (X)</text>
    <text x="80" y="50" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Ikan Kecil & Cumi</text>
    <text x="80" y="68" fill="#fca5a5" font-size="10" text-anchor="middle">(Komponen Kunci)</text>
  </g>

  <!-- Pinguin -->
  <g transform="translate(460, 150)">
    <rect x="0" y="0" width="150" height="70" rx="12" fill="#4c1d95" stroke="#a78bfa" stroke-width="2" />
    <text x="75" y="25" fill="#ddd6fe" font-size="10" font-weight="bold" text-anchor="middle">PREDATOR LANGSUNG</text>
    <text x="75" y="48" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Pinguin</text>
    <text x="75" y="63" fill="#c4b5fd" font-size="10" text-anchor="middle">(Konsumen Sekunder)</text>
  </g>

  <!-- Anjing Laut -->
  <g transform="translate(460, 275)">
    <rect x="0" y="0" width="150" height="70" rx="12" fill="#4c1d95" stroke="#a78bfa" stroke-width="2" />
    <text x="75" y="25" fill="#ddd6fe" font-size="10" font-weight="bold" text-anchor="middle">PREDATOR LANGSUNG</text>
    <text x="75" y="48" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Anjing Laut</text>
    <text x="75" y="63" fill="#c4b5fd" font-size="10" text-anchor="middle">(Konsumen Sekunder)</text>
  </g>

  <!-- Paus Orca -->
  <g transform="translate(520, 25)">
    <rect x="0" y="0" width="140" height="65" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="70" y="25" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">PREDATOR PUNCAK</text>
    <text x="70" y="48" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Paus Orca</text>
  </g>

  <!-- Flow Arrows -->
  <path d="M 160,190 Q 200,130 240,125" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 180,240 Q 210,290 240,305" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 320,155 L 320,270" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 395,115 Q 460,75 515,60" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- DANGER IMPACT ARROWS -->
  <path d="M 405,300 Q 430,220 455,195" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-dasharray="5 3" marker-end="url(#arrow-danger)" />
  <path d="M 405,325 L 455,315" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-dasharray="5 3" marker-end="url(#arrow-danger)" />

  <path d="M 535,150 Q 560,120 575,95" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 605,275 Q 655,190 615,95" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Impact banner -->
  <g transform="translate(160, 385)">
    <rect x="0" y="0" width="380" height="32" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="1.5" />
    <text x="190" y="20" fill="#fca5a5" font-size="11" font-weight="bold" text-anchor="middle">
      Dampak Bottom-Up: Penurunan Ikan Kecil Mengancam Pinguin & Anjing Laut
    </text>
  </g>
</svg>
